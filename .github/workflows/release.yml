name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm
        required: true
        default: false
        type: boolean
      npm-tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify and pack release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must run from main.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata
        run: bun run release:verify

      - name: Run unit, type, lint, and contract checks
        run: |
          bun run test:unit
          bun run typecheck
          bun run lint
          bun run contract:verify

      - name: Build packages
        run: bun run build

      - name: Pack and install release artifacts
        run: bun run pack:verify

      - name: Upload installable package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: luxledger-package-tarballs
          path: .tmp/package-smoke/tarballs/*.tgz
          if-no-files-found: error

  publish:
    name: Publish packages
    if: inputs.publish
    needs: dry-run
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node and npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify and build release
        run: |
          bun run release:verify
          bun run build

      - name: Validate distribution tag
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [[ "$version" == *-* && "$NPM_TAG" == latest ]]; then
            echo 'Prerelease versions must use the next tag.' >&2
            exit 1
          fi
          if [[ "$version" != *-* && "$NPM_TAG" == next ]]; then
            echo 'Stable versions must use the latest tag.' >&2
            exit 1
          fi

      - name: Publish coordinated packages with provenance
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          packages=(core http postgres-adapter fastify-routes express-routes)
          for directory in "${packages[@]}"; do
            package_name="@luxledger/$directory"
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published; skipping."
              continue
            fi
            npm publish --workspace "$package_name" --access public --provenance --tag "$NPM_TAG"
          done
